<section>
    <h2 class="heading">Color Palette</h2>

    <div class="w-100 h-50 border-2 my-3" [ngStyle]="boxColor"></div>
    <ul class="flex items-center gap-2">
        <li *ngFor="let color of colors" class="border rounded px-1 cursor-pointer" (click)="colorChange(color)" [ngStyle]="{'background-color':color}">{{color}}</li>
    </ul>
</section>
