<div class="dashboard-container">

  <h2>User Management Dashboard</h2>
  <div class="chartGrid">
    <div class="chart-card chart-box">
      <h3>Bar Chart</h3>
      <canvas #userChart></canvas>
    </div>

    <div class="bubble-card chart-box">
      <h3>Bubble Chart</h3>
      <canvas #bubbleChart></canvas>
    </div>

    <div class="scatter-card chart-box">
      <h3>Scatter Chart</h3>
      <canvas #scatterChart></canvas>
    </div>    

    <div class="line-card chart-box">
      <h3>Line Chart</h3>
      <canvas #lineChat></canvas>
    </div>

    <div class="pie-card chart-box circle">
      <h3>Pie Chart</h3>
      <canvas #pieChat></canvas>
    </div>

    <div class="pie-card chart-box circle">
      <h3>Doughnut Chart</h3>
      <canvas #doughnutChart></canvas>
    </div>
  </div>
</div>
