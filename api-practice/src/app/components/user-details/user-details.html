<div>
    @if(user){
    <h2>{{ user.name }}</h2>

    <p>
        ID: {{ user.id }}
    </p>

    <p>
        Username: {{ user.username }}
    </p>

    <p>
        Email: {{ user.email }}
    </p>

    <p>
        Phone: {{ user.phone }}
    </p>

    <p>
        Website: {{ user.website }}
    </p>

}
@else{
    <p>Logging...</p>
}
   
</div>
